<!-- Cookie Consent Banner Component (Lindy.ai Daylight Edition) -->
<div 
  id="lumilore-cookie-banner" 
  role="region" 
  aria-label="Cookie and Privacy Consent" 
  class="fixed bottom-4 left-4 right-4 md:left-6 md:right-auto md:max-w-md z-40 transform transition-all duration-500 ease-spring opacity-0 translate-y-8 pointer-events-none"
>
  <div class="relative bg-white border border-[#EAE6DF] rounded-2xl p-5 shadow-2xl text-[#0D1520]">

    <!-- Header Row -->
    <div class="flex items-start justify-between gap-3 mb-2.5">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-lg bg-[#FAF6EC] border border-[#EAE6DF] flex items-center justify-center text-xs text-[#B45309]">
          🛡️
        </span>
        <span class="font-display font-bold text-sm text-[#0D1520] tracking-tight">
          Privacy &amp; Cookie Governance
        </span>
      </div>

      <!-- Quick Dismiss Button -->
      <button 
        type="button" 
        id="cookie-dismiss-btn" 
        class="min-w-[44px] min-h-[44px] flex items-center justify-center p-2 rounded-xl text-[#4B5563] hover:text-[#0D1520] transition-colors hover:bg-[#F3EFE6] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#B45309] cursor-pointer"
        aria-label="Dismiss cookie notice"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Description Copy -->
    <p class="text-xs text-[#4B5563] leading-relaxed mb-4">
      LumiLore utilizes strictly functional storage to preserve your audience experience (<span class="text-[#0D1520] font-mono text-[11px] font-bold">Corporate</span> vs. <span class="text-[#B45309] font-mono text-[11px] font-bold">Trades</span>) and secure our serverless cloud edge. We do not sell data or deploy advertising trackers. Read our <a href="/privacy/" class="text-[#2563EB] hover:text-[#0D1520] hover:underline font-semibold min-h-[44px] inline-flex items-center">Privacy Policy</a>.
    </p>

    <!-- Action Button Row -->
    <div class="flex items-center gap-2.5">
      <button 
        type="button" 
        id="cookie-accept-all-btn" 
        class="min-h-[44px] sm:min-h-[48px] flex items-center justify-center flex-1 py-2.5 px-4 rounded-xl bg-[#0D1520] hover:bg-[#1E293B] text-white font-bold text-xs font-mono shadow-md transition-all cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2563EB] transform active:scale-98"
      >
        Accept All
      </button>
      <button 
        type="button" 
        id="cookie-essential-only-btn" 
        class="min-h-[44px] sm:min-h-[48px] flex items-center justify-center py-2.5 px-4 rounded-xl bg-white hover:bg-[#F3EFE6] border border-[#EAE6DF] text-[#0D1520] font-semibold text-xs font-mono transition-all cursor-pointer shadow-xs focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#2563EB] transform active:scale-98"
      >
        Essential Only
      </button>
    </div>

  </div>
</div>

<!-- Vanilla LocalStorage Consent Engine (Micro-Step 3.2) -->
<script>
  (function initLumiLoreCookieEngine() {
    var banner = document.getElementById('lumilore-cookie-banner');
    var acceptBtn = document.getElementById('cookie-accept-all-btn');
    var essentialBtn = document.getElementById('cookie-essential-only-btn');
    var dismissBtn = document.getElementById('cookie-dismiss-btn');

    if (!banner) return;

    function showBanner() {
      banner.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
      banner.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
    }

    function hideBanner() {
      banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      banner.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
    }

    function saveConsent(preference) {
      try {
        localStorage.setItem('lumilore_cookie_consent', preference);
        localStorage.setItem('lumilore_cookie_consent_date', new Date().toISOString());
      } catch (e) {
        console.warn('LocalStorage unavailable for cookie consent:', e);
      }
      hideBanner();
      window.dispatchEvent(new CustomEvent('lumilore_consent_saved', { detail: { consent: preference } }));
    }

    if (acceptBtn) {
      acceptBtn.addEventListener('click', function() {
        saveConsent('all');
      });
    }

    if (essentialBtn) {
      essentialBtn.addEventListener('click', function() {
        saveConsent('essential');
      });
    }

    if (dismissBtn) {
      dismissBtn.addEventListener('click', function() {
        hideBanner();
      });
    }

    // Global preference opener exposed for footer link
    window.openLumiCookieSettings = function openLumiCookieSettings() {
      showBanner();
      if (acceptBtn) {
        setTimeout(function() {
          try { acceptBtn.focus(); } catch (e) {}
        }, 200);
      }
    };

    // Explicit binding to footer trigger
    var footerTrigger = document.getElementById('footer-cookie-settings-trigger');
    if (footerTrigger) {
      footerTrigger.addEventListener('click', function(e) {
        e.preventDefault();
        window.openLumiCookieSettings();
      });
    }

    // Keyboard ESC listener for accessibility
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && banner.classList.contains('opacity-100')) {
        hideBanner();
      }
    });

    // Auto-detect existing consent on load
    try {
      var saved = localStorage.getItem('lumilore_cookie_consent');
      if (!saved) {
        setTimeout(function() {
          showBanner();
        }, 1200);
      }
    } catch (e) {
      // LocalStorage blocked/unsupported
    }
  })();
</script>
