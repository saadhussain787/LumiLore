<!-- Cookie Consent Banner Component (Sprint 1 Micro-Step 3.1 & 3.2) -->
<div 
  id="lumilore-cookie-banner" 
  role="region" 
  aria-label="Cookie and Privacy Consent" 
  class="fixed bottom-4 left-4 right-4 md:left-6 md:right-auto md:max-w-md z-40 transform transition-all duration-500 ease-spring opacity-0 translate-y-8 pointer-events-none"
>
  <div class="relative bg-slate-900/95 border border-cyan-400/30 backdrop-blur-xl rounded-2xl p-5 shadow-[0_12px_45px_rgba(0,0,0,0.7)] text-slate-300">
    
    <!-- Ambient Glow Highlight -->
    <div class="absolute -inset-0.5 rounded-2xl bg-gradient-to-r from-cyan-400/10 via-transparent to-amber-400/10 blur-sm pointer-events-none -z-10"></div>

    <!-- Header Row -->
    <div class="flex items-start justify-between gap-3 mb-2.5">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-lg bg-cyan-950/80 border border-cyan-400/40 flex items-center justify-center text-xs text-cyan-300">
          🛡️
        </span>
        <span class="font-headline font-bold text-sm text-white tracking-tight">
          Privacy &amp; Cookie Governance
        </span>
      </div>

      <!-- Quick Dismiss Button -->
      <button 
        type="button" 
        id="cookie-dismiss-btn" 
        class="text-slate-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/5 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-cyan-400 cursor-pointer"
        aria-label="Dismiss cookie notice"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Description Copy -->
    <p class="text-xs text-slate-300 leading-relaxed mb-4">
      LumiLore utilizes strictly functional storage to preserve your audience experience (<span class="text-white font-mono text-[11px]">Corporate</span> vs. <span class="text-amber-300 font-mono text-[11px]">Trades</span>) and secure our serverless cloud edge. We do not sell data or deploy advertising trackers. Read our <a href="/privacy/" class="text-cyan-400 hover:underline font-medium">Privacy Policy</a>.
    </p>

    <!-- Action Button Row -->
    <div class="flex items-center gap-2.5">
      <button 
        type="button" 
        id="cookie-accept-all-btn" 
        class="flex-1 py-2 px-3.5 rounded-xl bg-gradient-to-r from-cyan-400 to-cyan-500 hover:from-cyan-300 hover:to-cyan-400 text-slate-950 font-bold text-xs font-mono shadow-[0_0_15px_rgba(0,242,254,0.3)] transition-all cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 transform active:scale-98"
      >
        Accept All
      </button>
      <button 
        type="button" 
        id="cookie-essential-only-btn" 
        class="py-2 px-3.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 text-slate-300 hover:text-white font-semibold text-xs font-mono transition-all cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-400 transform active:scale-98"
      >
        Essential Only
      </button>
    </div>

  </div>
</div>

<!-- Vanilla LocalStorage Consent Engine (Micro-Step 3.2) -->
<script>
  (function initLumiLoreCookieEngine() {
    var banner = document.getElementById('lumilore-cookie-banner');
    var acceptBtn = document.getElementById('cookie-accept-all-btn');
    var essentialBtn = document.getElementById('cookie-essential-only-btn');
    var dismissBtn = document.getElementById('cookie-dismiss-btn');

    if (!banner) return;

    function showBanner() {
      banner.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
      banner.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');
    }

    function hideBanner() {
      banner.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
      banner.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
    }

    function saveConsent(preference) {
      try {
        localStorage.setItem('lumilore_cookie_consent', preference);
        localStorage.setItem('lumilore_cookie_consent_date', new Date().toISOString());
      } catch (e) {
        console.warn('LocalStorage unavailable for cookie consent:', e);
      }
      hideBanner();
      window.dispatchEvent(new CustomEvent('lumilore_consent_saved', { detail: { consent: preference } }));
    }

    if (acceptBtn) {
      acceptBtn.addEventListener('click', function() {
        saveConsent('all');
      });
    }

    if (essentialBtn) {
      essentialBtn.addEventListener('click', function() {
        saveConsent('essential');
      });
    }

    if (dismissBtn) {
      dismissBtn.addEventListener('click', function() {
        hideBanner();
      });
    }

    // Global preference opener exposed for footer link
    window.openLumiCookieSettings = function openLumiCookieSettings() {
      showBanner();
      if (acceptBtn) {
        setTimeout(function() {
          try { acceptBtn.focus(); } catch (e) {}
        }, 200);
      }
    };

    // Explicit binding to footer trigger
    var footerTrigger = document.getElementById('footer-cookie-settings-trigger');
    if (footerTrigger) {
      footerTrigger.addEventListener('click', function(e) {
        e.preventDefault();
        window.openLumiCookieSettings();
      });
    }

    // Keyboard ESC listener for accessibility
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && banner.classList.contains('opacity-100')) {
        hideBanner();
      }
    });

    // Auto-detect existing consent on load
    try {
      var saved = localStorage.getItem('lumilore_cookie_consent');
      if (!saved) {
        setTimeout(function() {
          showBanner();
        }, 1200);
      }
    } catch (e) {
      // LocalStorage blocked/unsupported
    }
  })();
</script>
