<!-- Universal Ambient Particle Field (Three.js WebGL Engine) -->
<script>
  (function initUniversalParticleField() {
    function setupParticles() {
      const container = document.getElementById('webgl-container');
      if (!container || typeof THREE === 'undefined') return;

      // Prevent duplicate instances if already initialized
      if (window.lumiParticleSystem && container.contains(container.querySelector('canvas'))) return;

      // --- Viewport & Device Diagnostics ---
      const isMobile = window.innerWidth < 768;
      let currentIsMobile = isMobile;
      const maxDPR = isMobile ? 1.5 : 2.0;

      // --- Scene Setup ---
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 8;

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDPR));
      renderer.domElement.style.opacity = '0';
      renderer.domElement.style.transition = 'opacity 0.6s ease-out';
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
      renderer.domElement.style.display = 'block';
      container.appendChild(renderer.domElement);
      requestAnimationFrame(function() {
        renderer.domElement.style.opacity = '1';
      });

      // --- Dynamic Particle Geometry Generator ---
      function createParticleGeometry(count) {
        const geo = new THREE.BufferGeometry();
        const pos1 = new Float32Array(count * 3);
        const pos2 = new Float32Array(count * 3);
        const pos3 = new Float32Array(count * 3);
        const pos4 = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;

          // 1. Sphere (Hero / Ambient Base)
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const r = 2.5 + (Math.random() * 0.2);
          pos1[i3] = r * Math.sin(phi) * Math.cos(theta);
          pos1[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
          pos1[i3 + 2] = r * Math.cos(phi);

          // 2. Galaxy Wave
          const arm = Math.floor(Math.random() * 3);
          const dist = Math.random() * 5;
          const angle = dist * 1.5 + (arm * Math.PI * 2 / 3);
          const spread = (5 - dist) * 0.2 * (Math.random() - 0.5);
          pos2[i3] = Math.cos(angle) * dist + spread;
          pos2[i3 + 1] = (Math.random() - 0.5) * 0.5;
          pos2[i3 + 2] = Math.sin(angle) * dist + spread;

          // 3. Torus Knot (Architecture)
          const t = Math.random() * Math.PI * 2;
          const p = 2;
          const q = 3;
          const rKnot = 0.8 + (Math.random() * 0.4);
          pos3[i3] = rKnot * (2 + Math.cos(q * t)) * Math.cos(p * t);
          pos3[i3 + 1] = rKnot * (2 + Math.cos(q * t)) * Math.sin(p * t);
          pos3[i3 + 2] = rKnot * Math.sin(q * t);

          // 4. Ring (ROI / End)
          const ringAngle = Math.random() * Math.PI * 2;
          const ringRadius = 4.0 + (Math.random() * 1.5);
          pos4[i3] = Math.cos(ringAngle) * ringRadius;
          pos4[i3 + 1] = (Math.random() - 0.5) * 0.2;
          pos4[i3 + 2] = Math.sin(ringAngle) * ringRadius;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos1, 3));
        geo.setAttribute('position1', new THREE.BufferAttribute(pos1, 3));
        geo.setAttribute('position2', new THREE.BufferAttribute(pos2, 3));
        geo.setAttribute('position3', new THREE.BufferAttribute(pos3, 3));
        geo.setAttribute('position4', new THREE.BufferAttribute(pos4, 3));

        return geo;
      }

      const initialCount = isMobile ? 8000 : 35000;
      let geometry = createParticleGeometry(initialCount);

      // --- Custom Shader Material with Dynamic Point Size ---
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uProgress: { value: 0.0 },
          uTime: { value: 0.0 },
          uPointSize: { value: isMobile ? 14.5 : 12.0 },
          uColor1: { value: new THREE.Color('#00F2FE') }, // Vibrant Cyan
          uColor2: { value: new THREE.Color('#6366F1') }  // Vibrant Indigo
        },
        vertexShader: `
          uniform float uProgress;
          uniform float uTime;
          uniform float uPointSize;
          attribute vec3 position1;
          attribute vec3 position2;
          attribute vec3 position3;
          attribute vec3 position4;

          varying vec3 vColor;
          varying float vDepthAlpha;
          uniform vec3 uColor1;
          uniform vec3 uColor2;

          void main() {
            vec3 finalPos = position1;
            float p = uProgress;
            
            if(p < 1.0) {
                finalPos = mix(position1, position2, smoothstep(0.0, 1.0, p));
            } else if(p < 2.0) {
                finalPos = mix(position2, position3, smoothstep(1.0, 2.0, p));
            } else {
                finalPos = mix(position3, position4, smoothstep(2.0, 3.0, clamp(p, 2.0, 3.0)));
            }

            // Gentle ambient cyber-wave noise
            finalPos.y += sin(uTime + finalPos.x * 2.0) * 0.1;
            finalPos.x += cos(uTime + finalPos.y * 2.0) * 0.1;

            // Clamp Z depth to keep particles securely behind content plane
            finalPos.z = min(finalPos.z, 1.8);

            vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            
            // Size attenuation based on distance and device point size
            gl_PointSize = (uPointSize / -mvPosition.z);
            
            // Color mixing based on depth and position
            float mixFactor = clamp((finalPos.x + finalPos.z) * 0.2 + 0.5, 0.0, 1.0);
            vColor = mix(uColor1, uColor2, mixFactor);

            // Center-softening: soften particle opacity in the direct line of sight
            float centerDist = length(finalPos.xy);
            vDepthAlpha = clamp(0.35 + smoothstep(0.5, 3.5, centerDist) * 0.65, 0.2, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vDepthAlpha;
          void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if(dist > 0.5) discard;
            
            float alpha = 1.0 - smoothstep(0.3, 0.5, dist);
            gl_FragColor = vec4(vColor, alpha * 0.55 * vDepthAlpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particles = new THREE.Points(geometry, material);
      
      // Scale particle constellation to fill background
      particles.position.x = 0; 
      particles.position.y = 0;
      particles.scale.set(2.0, 2.0, 2.0);
      
      scene.add(particles);

      // --- Dynamic Rebuild Function with Strict Memory Disposal ---
      function updateParticleCount(newCount) {
        if (!particles) return;
        const oldGeo = particles.geometry;
        particles.geometry = createParticleGeometry(newCount);
        if (oldGeo) oldGeo.dispose();
        if (material && material.uniforms && material.uniforms.uPointSize) {
          material.uniforms.uPointSize.value = (newCount < 15000) ? 14.5 : 12.0;
        }
      }

      // --- Expose for Page-Specific ScrollTrigger / Custom Controls ---
      window.lumiParticleMaterial = material;
      window.lumiParticleSystem = particles;
      window.lumiParticleCount = initialCount;
      window.setLumiParticleCount = updateParticleCount;

      // --- Inner-Page Ambient Scroll Sync (when not on homepage) ---
      const isHomepage = window.location.pathname === '/' || window.location.pathname === '/index.html' || window.location.pathname === '';
      if (!isHomepage) {
        let scrollTicking = false;
        window.addEventListener('scroll', () => {
          if (scrollTicking) return;
          scrollTicking = true;
          requestAnimationFrame(() => {
            const maxScroll = Math.max(document.body.scrollHeight - window.innerHeight, 1);
            const scrollRatio = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
            // Gently drift progress up to 1.2 across inner page read depth
            material.uniforms.uProgress.value = scrollRatio * 1.2;
            particles.position.y = (scrollRatio * 1.5) - 0.75;
            scrollTicking = false;
          });
        }, { passive: true });
      }

      // --- Animation Loop State & Energy Saver Guards ---
      const clock = new THREE.Clock();
      let isCanvasVisible = true;
      let isTabVisible = !document.hidden;
      let rafId = null;
      let mouseX = 0;
      let mouseY = 0;
      let mouseTicking = false;

      // Throttled mouse tracking for ambient parallax
      function onMouseMove(e) {
        if (mouseTicking) return;
        mouseTicking = true;
        const cx = e.clientX;
        const cy = e.clientY;
        requestAnimationFrame(() => {
          mouseX = (cx / window.innerWidth - 0.5) * 2;
          mouseY = -(cy / window.innerHeight - 0.5) * 2;
          mouseTicking = false;
        });
      }

      if (window.matchMedia('(pointer: fine)').matches) {
        window.addEventListener('mousemove', onMouseMove, { passive: true });
      }

      function animate() {
        if (!isCanvasVisible || !isTabVisible) {
          rafId = null;
          return;
        }

        rafId = requestAnimationFrame(animate);
        
        const time = clock.getElapsedTime();
        material.uniforms.uTime.value = time;
        
        // Gentle system rotation with smooth dampening
        particles.rotation.y = time * 0.05 + (mouseX * 0.15);
        particles.rotation.x = (mouseY * 0.15);
        
        renderer.render(scene, camera);
      }

      function startLoop() {
        if (!rafId && isCanvasVisible && isTabVisible) {
          if (!clock.running) {
            clock.start();
          }
          animate();
        }
      }

      function stopLoop() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        if (clock && clock.running) {
          clock.stop();
        }
      }

      startLoop();

      // --- WebGL Device Context Loss & Recovery Safeguards ---
      if (renderer && renderer.domElement) {
        renderer.domElement.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          stopLoop();
        }, false);

        renderer.domElement.addEventListener('webglcontextrestored', () => {
          startLoop();
        }, false);
      }

      // --- Tab Visibility & Energy Management ---
      document.addEventListener('visibilitychange', () => {
        isTabVisible = !document.hidden;
        if (isTabVisible && isCanvasVisible) {
          startLoop();
        } else {
          stopLoop();
        }
      });

      // --- Complete Three.js Garbage Collection Lifecycle Safeguard ---
      function disposeThreeScene() {
        stopLoop();
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('resize', onResize);

        if (particles) {
          if (particles.geometry) particles.geometry.dispose();
          if (particles.material) {
            if (Array.isArray(particles.material)) {
              particles.material.forEach(m => m.dispose());
            } else {
              particles.material.dispose();
            }
          }
          scene.remove(particles);
        }

        scene.traverse((object) => {
          if (object.geometry) object.geometry.dispose();
          if (object.material) {
            if (Array.isArray(object.material)) {
              object.material.forEach(m => m.dispose());
            } else {
              object.material.dispose();
            }
          }
        });

        if (renderer) {
          renderer.dispose();
          if (typeof renderer.forceContextLoss === 'function') {
            renderer.forceContextLoss();
          }
          if (renderer.domElement && renderer.domElement.parentNode) {
            renderer.domElement.parentNode.removeChild(renderer.domElement);
          }
        }
      }

      window.disposeLumiParticleSystem = disposeThreeScene;

      // --- bfcache Optimization: Non-Destructive pagehide & pageshow Lifecycle ---
      // Replaces destructive beforeunload, allowing modern browsers (Chrome/Safari/Firefox)
      // to retain DOM & WebGL context in bfcache for sub-50ms back/forward transitions.
      window.addEventListener('pagehide', (e) => {
        isCanvasVisible = false;
        stopLoop();
        // If the page is NOT persisted in bfcache, perform full garbage collection
        if (!e.persisted) {
          disposeThreeScene();
        }
      });

      window.addEventListener('pageshow', (e) => {
        isCanvasVisible = true;
        isTabVisible = !document.hidden;
        if (e.persisted) {
          // Check if viewport dimensions shifted while cached
          if (renderer && camera) {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          }
          // Restored from bfcache: ensure clock delta is reset and resume render loop cleanly
          if (clock) {
            clock.start();
          }
          startLoop();
        }
      });

      // --- Handle Resize with Cross-Breakpoint Adaptation ---
      let resizeTimer = null;
      function onResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

        const isNowMobile = window.innerWidth < 768;
        const targetDPR = isNowMobile ? 1.5 : 2.0;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, targetDPR));

        if (isNowMobile !== currentIsMobile) {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            currentIsMobile = isNowMobile;
            const targetCount = isNowMobile ? 8000 : 35000;
            updateParticleCount(targetCount);
            window.lumiParticleCount = targetCount;
          }, 150);
        }
      }
      window.addEventListener('resize', onResize, { passive: true });
    }

    let hydrated = false;
    function triggerParticleHydration() {
      if (hydrated) return;
      hydrated = true;

      // Clean up interaction triggers
      ['scroll', 'pointermove', 'touchstart'].forEach(function(evt) {
        window.removeEventListener(evt, triggerParticleHydration, { passive: true });
      });

      function executeSetup() {
        if (typeof THREE !== 'undefined') {
          setupParticles();
        } else if (typeof window.__loadThreeJs === 'function') {
          window.__loadThreeJs(setupParticles);
        } else {
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js';
          s.async = true;
          s.onload = setupParticles;
          document.head.appendChild(s);
        }
      }

      if ('requestIdleCallback' in window) {
        requestIdleCallback(function() { executeSetup(); }, { timeout: 1500 });
      } else {
        setTimeout(executeSetup, 100);
      }
    }

    // Passive gesture hooks: user interaction hydrates immediately
    ['scroll', 'pointermove', 'touchstart'].forEach(function(evt) {
      window.addEventListener(evt, triggerParticleHydration, { once: true, passive: true });
    });

    // Idle fallback if user does not interact within 2.5s of page load
    if (document.readyState === 'complete') {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(triggerParticleHydration, { timeout: 2500 });
      } else {
        setTimeout(triggerParticleHydration, 2000);
      }
    } else {
      window.addEventListener('load', function() {
        if ('requestIdleCallback' in window) {
          requestIdleCallback(triggerParticleHydration, { timeout: 2500 });
        } else {
          setTimeout(triggerParticleHydration, 2000);
        }
      }, { once: true });
    }
  })();
</script>
