<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiLore Technologies</title>
  <meta name="description" content="LumiLore Technologies - Cloud Architecture & AI Intelligent Systems">
  <link rel="icon" type="image/png" href="/public/favicon.png">
  
  <!-- Stitch Design System Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      /* Stitch Design System - Colors */
      --color-surface: #05070a;
      --color-surface-dim: #030507;
      --color-surface-bright: #0a0e14;
      --color-surface-container-lowest: #010203;
      --color-surface-container-low: #030507;
      --color-surface-container: #05070a;
      --color-surface-container-high: #0a0e14;
      --color-surface-container-highest: #0f141e;
      --color-on-surface: #f1f5f9;
      --color-on-surface-variant: #94a3b8;
      --color-outline: #1e293b;
      --color-outline-variant: #334155;
      --color-primary: #00f2fe;
      --color-on-primary: #001a1c;
      --color-primary-container: #004a4f;
      --color-on-primary-container: #ccfbff;
      --color-secondary: #6366f1;
      --color-on-secondary: #0a0a2a;
      --color-secondary-container: #31327a;
      --color-on-secondary-container: #e0e0ff;
      --color-background: #05070a;
      --color-on-background: #f1f5f9;

      /* Legacy Aliases */
      --color-bg-dark: var(--color-background);
      --color-surface-dark: var(--color-surface-container-highest);
      --color-border-dark: var(--color-outline);
      --color-cyan-glow: var(--color-primary);
      --color-indigo-core: var(--color-secondary);
      --color-titanium: var(--color-outline-variant);

      /* Stitch Design System - Typography */
      --font-headline: "Space Grotesk", sans-serif;
      --font-body: "Inter", sans-serif;
      --animate-aurora: aurora 15s linear infinite;
      @keyframes aurora {
        0% { transform: translate(0, 0) scale(1); opacity: 0.5; }
        33% { transform: translate(30px, -50px) scale(1.1); opacity: 0.8; }
        66% { transform: translate(-20px, 20px) scale(0.9); opacity: 0.6; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.5; }
      }
      @keyframes panGlow {
        0% { background-position: 100% 0; }
        100% { background-position: -100% 0; }
      }
      @keyframes shimmer {
        0% { transform: translateX(-150%) skewX(-20deg); }
        100% { transform: translateX(200%) skewX(-20deg); }
      }
    }
    @layer utilities {
      .glass-panel { background-color: var(--color-surface-dark); border: 1px solid var(--color-border-dark); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
      .circuit-border { position: relative; z-index: 1; }
      .circuit-border::before { content: ''; position: absolute; inset: -1px; background: linear-gradient(135deg, var(--color-cyan-glow), var(--color-indigo-core)); z-index: -1; border-radius: inherit; opacity: 0.8; }
      .circuit-border::after { content: ''; position: absolute; inset: 1px; background-color: var(--color-titanium); z-index: -1; border-radius: calc(inherit - 2px); }
      .glow-cta { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3); transition: box-shadow 0.3s ease, transform 0.2s ease; }
      .glow-cta:hover { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6); transform: translateY(-1px); }
    }
  </style>
  
  <!-- JSON-LD Microdata -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "LumiLore Technologies",
    "url": "https://lumilore.com",
    "logo": "https://lumilore.com/logo.webp",
    "description": "Enterprise cloud architecture and intelligent AI systems.",
    "sameAs": [
      "https://twitter.com/lumilore",
      "https://github.com/lumilore",
      "https://linkedin.com/company/lumilore"
    ]
  }
  </script>
</head>
<body class="bg-background text-on-background font-body antialiased flex flex-col min-h-screen">
  
  <!-- Navigation -->
  <header class="fixed top-6 left-1/2 -translate-x-1/2 w-[95%] max-w-5xl z-50 glass-panel rounded-full border border-border-dark shadow-[0_10px_40px_-10px_rgba(0,242,254,0.15)] transition-all duration-300">
    <div class="px-6 sm:px-8">
      <div class="flex justify-between items-center h-16">
        
        <!-- Logo -->
        <div class="flex-shrink-0 flex items-center">
          <a href="/" class="flex items-center gap-3 group">
            <img class="h-8 md:h-10 w-auto object-contain transition-transform duration-300 hover:scale-105" style="filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.4));" src="/public/logo.webp" onerror="this.onerror=null; this.src='/frontend/logo.webp';" alt="LumiLore Technologies">
          </a>
        </div>

        <!-- Desktop Navigation -->
        <nav class="hidden md:flex space-x-8 items-center">
          <a href="/solutions" class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors py-2">
            Solutions
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-cyan-glow transition-all duration-300 group-hover:w-full shadow-[0_0_8px_rgba(0,242,254,0.8)]"></span>
          </a>
          <a href="/case-studies" class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors py-2">
            Case Studies
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-cyan-glow transition-all duration-300 group-hover:w-full shadow-[0_0_8px_rgba(0,242,254,0.8)]"></span>
          </a>
          <a href="/about" class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors py-2">
            About
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-cyan-glow transition-all duration-300 group-hover:w-full shadow-[0_0_8px_rgba(0,242,254,0.8)]"></span>
          </a>
          <a href="/contact" class="group relative text-sm font-medium text-slate-300 hover:text-white transition-colors py-2">
            Contact
            <span class="absolute bottom-0 left-0 w-0 h-[2px] bg-cyan-glow transition-all duration-300 group-hover:w-full shadow-[0_0_8px_rgba(0,242,254,0.8)]"></span>
          </a>
          
          <a href="/deploy" class="relative overflow-hidden circuit-border glow-cta ml-4 px-6 py-2 rounded-full text-cyan-glow text-xs font-bold tracking-widest uppercase hover:text-white transition-all bg-surface-dark group">
            <span class="relative z-10">Deploy System</span>
            <!-- Shimmer effect -->
            <div class="absolute inset-0 bg-gradient-to-r from-transparent via-cyan-glow/30 to-transparent w-full h-full pointer-events-none z-0 animate-[shimmer_3s_infinite_linear]"></div>
          </a>
        </nav>

        <!-- Mobile Menu Button -->
        <div class="md:hidden flex items-center">
          <button type="button" class="text-slate-300 hover:text-white p-2" aria-controls="mobile-menu" aria-expanded="false">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Placeholder -->
  <main class="flex-grow pt-24 pb-12 relative overflow-hidden">
    <!-- Aurora Background -->
    <div class="absolute inset-0 z-[-1] pointer-events-none opacity-20">
      <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-indigo-core rounded-full mix-blend-screen filter blur-[100px] animate-aurora"></div>
      <div class="absolute top-[20%] right-[-10%] w-96 h-96 bg-cyan-glow rounded-full mix-blend-screen filter blur-[100px] animate-aurora" style="animation-delay: -5s;"></div>
    </div>

    <!-- Content Slot -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      {{ content }}
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="border-t border-border-dark bg-surface-dark py-8 mt-auto relative z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-4">
      
      <div class="text-xs text-slate-400">
        &copy; 2026 LumiLore Technologies. All rights reserved.
      </div>

      <!-- Edge Status Beacon -->
      <div class="flex items-center gap-2 text-xs font-semibold text-emerald-400 bg-emerald-400/10 px-3 py-1.5 rounded-full border border-emerald-400/20">
        <span class="animate-pulse">⚡</span> AWS Global Edge • 100% Serverless
      </div>

      <!-- Social Links -->
      <div class="flex space-x-6 text-slate-400">
        <a href="#" class="hover:text-cyan-glow transition-colors">Twitter</a>
        <a href="#" class="hover:text-cyan-glow transition-colors">GitHub</a>
        <a href="#" class="hover:text-cyan-glow transition-colors">LinkedIn</a>
      </div>
    </div>
  </footer>

</body>
</html>
