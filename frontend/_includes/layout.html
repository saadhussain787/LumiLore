  <!-- Three.js (For Topology Field) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

  <!-- Swiper JS & Lenis JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    // Removed Lenis Scroll as requested by user
    if (typeof Lenis !== 'undefined') {
    }

    // Initialize Swiper (only if slider exists on page)
    if (document.querySelector('.solutions-slider') && typeof Swiper !== 'undefined') {
      const swiper = new Swiper('.solutions-slider', {
        effect: 'slide',
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: 1,
        breakpoints: {
          768: { slidesPerView: 2 },
          1024: { slidesPerView: 3 }
        },
        spaceBetween: 24,
        loop: true,
        speed: 1000,
        autoplay: {
          delay: 3500,
          disableOnInteraction: false,
          pauseOnMouseEnter: true,
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
        navigation: {
          nextEl: '.swiper-button-next',
          prevEl: '.swiper-button-prev',
        },
      });
    }

    // Initialize Card Flip Logic
    document.querySelectorAll('.origin-card').forEach(card => {
      const btn = card.querySelector('.toggle-tech-btn');
      const execBtn = card.querySelector('.toggle-exec-btn');
      const execView = card.querySelector('.executive-view');
      const techView = card.querySelector('.engineer-view');

      if (btn && execView && techView) {
        btn.addEventListener('click', () => {
          execView.style.opacity = '0';
          execView.style.pointerEvents = 'none';
          execView.style.transform = 'translateY(-10px)';
          
          techView.style.opacity = '1';
          techView.style.pointerEvents = 'auto';
          techView.style.transform = 'translateY(0)';
        });
      }

      if (execBtn && execView && techView) {
        execBtn.addEventListener('click', () => {
          techView.style.opacity = '0';
          techView.style.pointerEvents = 'none';
          techView.style.transform = 'translateY(10px)';
          
          execView.style.opacity = '1';
          execView.style.pointerEvents = 'auto';
          execView.style.transform = 'translateY(0)';
        });
      }
    });
  </script>

  <!-- Topology Field Animation -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('topology-container');
      if (!container || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      
      // Setup camera
      const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.z = 5;

      // Setup renderer
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Create Icosahedron Geometry (Topology Field)
      const geometry = new THREE.IcosahedronGeometry(2.0, 2);
      
      // Wireframe Lines
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.15 });
      const wireframe = new THREE.WireframeGeometry(geometry);
      const lines = new THREE.LineSegments(wireframe, lineMaterial);
      
      // Points/Nodes
      const pointMaterial = new THREE.PointsMaterial({ color: 0x00f2fe, size: 0.04, transparent: true, opacity: 0.8 });
      const points = new THREE.Points(geometry, pointMaterial);

      // Group them
      const innerGroup = new THREE.Group();
      innerGroup.add(lines);
      innerGroup.add(points);
      
      const outerGroup = new THREE.Group();
      outerGroup.add(innerGroup);

      // Add Logo inside the 3D space
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load('/public/logo.webp', (texture) => {
        texture.minFilter = THREE.LinearFilter;
        const aspect = texture.image.width / texture.image.height;
        const planeHeight = 2.4;
        const planeWidth = planeHeight * aspect;
        const logoGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const logoMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
        outerGroup.add(new THREE.Mesh(logoGeometry, logoMaterial));
      }, undefined, (err) => {
        // Fallback if /public path fails
        textureLoader.load('/frontend/logo.webp', (texture) => {
          texture.minFilter = THREE.LinearFilter;
          const aspect = texture.image.width / texture.image.height;
          const planeHeight = 2.4;
          const planeWidth = planeHeight * aspect;
          const logoGeometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
          const logoMaterial = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide });
          outerGroup.add(new THREE.Mesh(logoGeometry, logoMaterial));
        });
      });

      scene.add(outerGroup);

      // Mouse interaction
      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;

      document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX - window.innerWidth / 2);
        mouseY = (event.clientY - window.innerHeight / 2);
      });

      // Animation Loop
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const elapsedTime = clock.getElapsedTime();

        targetX = mouseX * 0.001;
        targetY = mouseY * 0.001;

        // Constant infinite rotation
        innerGroup.rotation.y += 0.002;
        innerGroup.rotation.x += 0.001;
        
        // Gentle float based on mouse (applied to outer container)
        outerGroup.rotation.y += 0.05 * (targetX - outerGroup.rotation.y);
        outerGroup.rotation.x += 0.05 * (targetY - outerGroup.rotation.x);

        // Gentle breathing scale and physical vertical float
        const scale = 1 + Math.sin(elapsedTime * 0.5) * 0.03;
        outerGroup.scale.set(scale, scale, scale);
        
        // Emulate the original CSS float animation
        outerGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.15;

        renderer.render(scene, camera);
      }
      
      animate();

      // Handle Resize
      window.addEventListener('resize', () => {
        if (!container) return;
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    });
  </script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const heroText = document.getElementById('hero-text');
        if (heroText) {
          const text = heroText.textContent;
          heroText.innerHTML = '';
          for (let char of text) {
            if (char === ' ') {
              heroText.appendChild(document.createTextNode(' '));
            } else {
              const span = document.createElement('span');
              span.textContent = char;
              span.className = 'inline-block transition-transform duration-300 hover:scale-y-[1.4] hover:scale-x-[1.1] hover:text-[#00F2FE] hover:-translate-y-1 cursor-default';
              heroText.appendChild(span);
            }
          }
        }
      });
    </script>
</body>
