<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon: Abstract L + Hexagon/Cube -->
  <g transform="translate(5, 5)">
    <path d="M 45 5 L 85 25 L 85 65 L 45 85 L 5 65 L 5 25 Z" fill="none" stroke="url(#icon-gradient)" stroke-width="6" stroke-linejoin="round" filter="url(#icon-glow)" />
    <path d="M 5 25 L 45 45 L 85 25" fill="none" stroke="url(#icon-gradient)" stroke-width="4" stroke-linejoin="round" />
    <path d="M 45 45 L 45 85" fill="none" stroke="url(#icon-gradient)" stroke-width="4" stroke-linejoin="round" />
    <!-- Inner L shape -->
    <path d="M 25 30 L 25 60 L 55 75" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linejoin="round" />
  </g>
</svg>
