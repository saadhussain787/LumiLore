<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiLore Technologies — Brand Showroom</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <style>
    body { background-color: #070A12; color: #F8FAFC; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 40px 20px; margin: 0; }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 32px; font-weight: 900; text-align: center; margin-bottom: 8px; }
    p.subtitle { text-align: center; color: #94A3B8; font-size: 14px; margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
    .card { background: #0E1424; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 32px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5); }
    .badge { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 12px; border-radius: 9999px; margin-bottom: 24px; }
    .badge-1 { background: rgba(0, 242, 254, 0.1); color: #00F2FE; border: 1px solid rgba(0, 242, 254, 0.3); }
    .badge-2 { background: rgba(16, 185, 129, 0.1); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-3 { background: rgba(99, 102, 241, 0.1); color: #818CF8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .preview-box { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    .desc { font-size: 13px; color: #94A3B8; line-height: 1.6; text-align: center; margin: 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LumiLore Technologies</h1>
    <p class="subtitle">Active Production Brand Mark</p>
    <div class="grid">
      <div class="card">
        <span class="badge badge-1">Production Asset (3D Render)</span>
        <div class="preview-box">
          <img src="./logo-render.png" alt="LumiLore 3D Render" style="max-height: 180px; width: auto; object-fit: contain; filter: drop-shadow(0 10px 25px rgba(0, 242, 254, 0.25));" />
        </div>
        <p class="desc"><strong>High-Resolution 3D Render.</strong> Official brand asset for LumiLore Technologies.</p>
      </div>
      <div class="card">
        <span class="badge badge-2">Production Asset (Vector SVG)</span>
        <div class="preview-box">
          <img src="./logo.svg" alt="LumiLore Vector SVG" style="max-height: 180px; width: auto; object-fit: contain; filter: drop-shadow(0 10px 25px rgba(0, 242, 254, 0.25));" />
        </div>
        <p class="desc"><strong>High-Fidelity Vector SVG.</strong> Scalable, resolution-independent production asset.</p>
      </div>
    </div>
  </div>
</body>
</html>
