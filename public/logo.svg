<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon: Abstract L + Hexagon/Cube -->
  <g transform="translate(10, 10)">
    <path d="M 50 10 L 90 30 L 90 70 L 50 90 L 10 70 L 10 30 Z" fill="none" stroke="url(#logo-gradient)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M 10 30 L 50 50 L 90 30" fill="none" stroke="url(#logo-gradient)" stroke-width="4" stroke-linejoin="round" />
    <path d="M 50 50 L 50 90" fill="none" stroke="url(#logo-gradient)" stroke-width="4" stroke-linejoin="round" />
    <!-- Inner L shape -->
    <path d="M 30 35 L 30 65 L 60 80" fill="none" stroke="#00f2fe" stroke-width="5" stroke-linejoin="round" />
  </g>

  <!-- Text -->
  <text x="120" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="46" fill="#ffffff" letter-spacing="2">LumiLore</text>
  <text x="348" y="70" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="46" fill="#00f2fe">.</text>
</svg>
